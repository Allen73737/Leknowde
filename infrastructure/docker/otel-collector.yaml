# Minimal OTLP collector used by the optional `observability` compose profile.
# It accepts traces, metrics and logs and writes them to the collector's log.
# The LeKnowde services do not emit OTLP spans yet; this only reserves the
# pipeline so instrumentation can be added without a topology change.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
